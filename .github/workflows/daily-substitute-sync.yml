name: Daily Morning Substitute Sync

on:
  schedule:
    # 01:20 UTC = 08:20 AM ICT (Early morning sync)
    - cron: '20 1 * * 1-5'
    # 01:30 UTC = 08:30 AM ICT (Assembly & morning check)
    - cron: '30 1 * * 1-5'
    # 01:40 UTC = 08:40 AM ICT (Start of Period 1)
    - cron: '40 1 * * 1-5'
    # 01:50 UTC = 08:50 AM ICT (Period 1 ongoing catch-up)
    - cron: '50 1 * * 1-5'
    # 02:05 UTC = 09:05 AM ICT (Start of Period 2)
    - cron: '05 2 * * 1-5'
    # 02:30 UTC = 09:30 AM ICT (Final morning sweep)
    - cron: '30 2 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Substitute Sync
        run: |
          echo "Calling Class Check Cron Sync API..."
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST "https://nwsp-class-check.vercel.app/api/substitute/cron-sync")
          echo "HTTP Status: $HTTP_RESPONSE"
          cat response.json
          if [ "$HTTP_RESPONSE" -ne 200 ]; then
            echo "Sync API returned status $HTTP_RESPONSE"
            exit 1
          fi
