name: Daily Morning Substitute Sync

on:
  schedule:
    # All times in UTC (ICT is UTC+7)
    # Pre-school morning preparation (Guaranteed ready BEFORE 08:35 AM ICT)
    - cron: '00 1 * * 1-5'  # 08:00 AM ICT (Early bird sync)
    - cron: '15 1 * * 1-5'  # 08:15 AM ICT (Preparation sync)
    - cron: '25 1 * * 1-5'  # 08:25 AM ICT (Assembly starts)
    - cron: '30 1 * * 1-5'  # 08:30 AM ICT (Assembly ends)
    - cron: '32 1 * * 1-5'  # 08:32 AM ICT (Pre-08:35 lock-in sync 1)
    - cron: '34 1 * * 1-5'  # 08:34 AM ICT (Pre-08:35 lock-in sync 2 - fully ready before 08:35!)
    - cron: '45 1 * * 1-5'  # 08:45 AM ICT (Period 1 ongoing catch-up)
    - cron: '30 2 * * 1-5'  # 09:30 AM ICT (Period 2-4 morning sweep)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Substitute Sync
        run: |
          echo "Calling Class Check Cron Sync API..."
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST "https://nwsp-class-check.vercel.app/api/substitute/cron-sync")
          echo "HTTP Status: $HTTP_RESPONSE"
          cat response.json
          if [ "$HTTP_RESPONSE" -ne 200 ]; then
            echo "Sync API returned status $HTTP_RESPONSE"
            exit 1
          fi
